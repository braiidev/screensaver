<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Resource hints for faster loading -->
    <link rel="preconnect" href="https://api.open-meteo.com" crossorigin />
    <link rel="preconnect" href="https://geocoding-api.open-meteo.com" crossorigin />
    <link rel="preconnect" href="https://freeipapi.com" crossorigin />
    <link rel="preconnect" href="https://api.bigdatacloud.net" crossorigin />
    <link rel="preconnect" href="https://cdn.pixabay.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.open-meteo.com" />
    <link rel="dns-prefetch" href="https://cdn.pixabay.com" />

    <link rel="preload" href="./assets/img/icon.png" as="image" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WeatherApp" />
    <link rel="apple-touch-icon" href="./assets/img/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=6e7b5426-3ec0-4231-bc61-1692d51436eb
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0e14" />
    <link rel="stylesheet" href="src/styles/index.css" />
    <link rel="shortcut icon" href="assets/img/icon.png" type="image/x-icon" />
    <meta
      name="description"
      content="Reloj y clima de una ciudad sobre un fondo de pantalla rotativo, para dejar en el televisor o en el movil."
    />
    <meta
      name="keywords"
      content="WeatherApp,Braiidev,clima,reloj,tiempo,geolocalizacion,screensaver"
    />
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5052094798057186"
      crossorigin="anonymous"
    ></script>
    <title>WeatherApp - Braiidev</title>
  </head>

  <body>
    <a class="skip-link" href="#main">Saltar al contenido principal</a>
    <div class="board">
      <div id="background" class="wallpaper" aria-hidden="true">
        <div id="tapeA" class="wallpaper__tape"></div>
        <div id="tapeB" class="wallpaper__tape"></div>
      </div>
      <div class="scrim" aria-hidden="true"></div>

      <main class="dashboard" id="main" tabindex="-1">
        <nav class="cities" id="cities" aria-label="Ciudades" hidden>
          <ul class="cities__list" id="cities-list"></ul>
        </nav>

        <section class="card" aria-label="Clima actual">
          <p class="card__city" id="location" aria-live="polite" aria-atomic="true"></p>

          <div class="card__now">
            <span class="card__temp" id="weather" aria-live="polite" aria-atomic="true"></span>
            <span class="meteo-icon card__icon" id="icon" aria-hidden="true"></span>
          </div>

          <p class="card__condition" id="condition" aria-live="polite" aria-atomic="true"></p>

          <p class="card__feels" id="feels" hidden></p>

          <div class="card__extras" id="card-extras">
            <div class="card__extras-row">
              <span id="sunrise-sunset" class="card__sun"></span>
              <span id="wind" class="card__wind"></span>
              <span id="humidity-uv" class="card__huuv"></span>
              <span id="trend" class="card__trend"></span>
            </div>
          </div>

          <ol class="hourly" id="hourly" aria-label="Próximas horas"></ol>

          <ol
            class="forecast"
            id="forecast"
            aria-label="Pronóstico de los próximos días"
          ></ol>

          <button class="retry" id="retry" type="button" hidden>
            Reintentar
          </button>
        </section>

        <footer class="clock">
          <p class="clock__date" id="day" aria-live="polite" aria-atomic="true"></p>
          <div class="clock__time">
            <span id="time" aria-live="polite" aria-atomic="true"></span>
            <span class="clock__period" id="period" aria-live="polite" aria-atomic="true"></span>
          </div>
        </footer>
      </main>

      <button
        class="gear"
        id="gear"
        type="button"
        aria-label="Ajustes"
        aria-controls="settings"
        aria-expanded="false"
      >
        <span class="gear__icon" data-icon aria-hidden="true"></span>
      </button>

      <dialog class="settings" id="settings" aria-labelledby="settings-title">
        <header class="settings__head">
          <h2 class="settings__title" id="settings-title">Ajustes</h2>
          <button
            class="settings__close"
            id="settings-close"
            type="button"
            aria-label="Cerrar ajustes"
          >
            <span aria-hidden="true">×</span>
          </button>
        </header>

        <div class="settings__body">
          <section class="settings__group" aria-labelledby="settings-appearance">
            <h3 class="settings__legend" id="settings-appearance">Apariencia</h3>

            <div class="settings__row">
              <label class="settings__label" for="theme-a">Estructura (A)</label>
              <select class="settings__select" id="theme-a">
                <option value="minimal">Minimal</option>
                <option value="clasico">Clásico</option>
                <option value="compacto">Compacto</option>
                <option value="tv">TV</option>
              </select>
            </div>

            <div class="settings__row">
              <label class="settings__label" for="theme-b">Tipografía/Estilo (B)</label>
              <select class="settings__select" id="theme-b">
                <option value="elegante">Elegante</option>
                <option value="dev">Dev</option>
                <option value="clasico">Clásico</option>
                <option value="arial">Arial</option>
              </select>
            </div>

            <div class="settings__row">
              <label class="settings__label" for="theme-align">Alineación</label>
              <select class="settings__select" id="theme-align">
                <option value="left">Izquierda</option>
                <option value="center">Centro</option>
                <option value="right">Derecha</option>
              </select>
            </div>

            <div class="settings__row">
              <label class="settings__label" for="theme-accent">Color de acento</label>
              <input class="settings__color" id="theme-accent" type="color" value="#4f9bff" />
            </div>

            <div class="settings__row">
              <label class="settings__label" for="theme-slot">Tema guardado</label>
              <select class="settings__select" id="theme-slot"></select>
            </div>

            <div class="settings__actions">
              <button class="settings__btn" id="theme-save" type="button">Guardar como...</button>
              <button class="settings__btn" id="theme-rename" type="button">Renombrar</button>
              <button class="settings__btn" id="theme-duplicate" type="button">Duplicar</button>
              <button class="settings__btn" id="theme-delete" type="button">Borrar</button>
            </div>
          </section>

          <section class="settings__group" aria-labelledby="settings-cities">
            <h3 class="settings__legend" id="settings-cities">Ciudades</h3>

            <ul class="places" id="city-list" aria-label="Ciudades guardadas"></ul>

            <label class="settings__label" for="city-search">Buscar y añadir</label>
            <input
              class="settings__search"
              id="city-search"
              type="search"
              placeholder="Nombre de la ciudad"
              autocomplete="off"
              spellcheck="false"
            />
            <p class="settings__hint" id="city-hint" role="status"></p>

            <ul
              class="places places--results"
              id="city-results"
              aria-label="Ciudades para añadir"
            ></ul>
          </section>

          <fieldset class="settings__group">
            <legend class="settings__legend">Unidades</legend>
            <div class="segmented">
              <label class="segmented__item">
                <input class="segmented__input" type="radio" name="units" value="celsius" />
                <span class="segmented__text">°C</span>
              </label>
              <label class="segmented__item">
                <input class="segmented__input" type="radio" name="units" value="fahrenheit" />
                <span class="segmented__text">°F</span>
              </label>
            </div>
          </fieldset>

          <fieldset class="settings__group">
            <legend class="settings__legend">Formato de hora</legend>
            <div class="segmented">
              <label class="segmented__item">
                <input class="segmented__input" type="radio" name="hourCycle" value="h23" />
                <span class="segmented__text">24 h</span>
              </label>
              <label class="segmented__item">
                <input class="segmented__input" type="radio" name="hourCycle" value="h12" />
                <span class="segmented__text">12 h</span>
              </label>
            </div>
          </fieldset>

          <fieldset class="settings__group">
            <legend class="settings__legend">Pantalla</legend>

            <label class="switch">
              <input class="switch__input" id="setting-forecast" type="checkbox" />
              <span class="switch__track" aria-hidden="true"></span>
              <span>Pronóstico de 5 días</span>
            </label>

            <label class="switch">
              <input class="switch__input" id="setting-feels" type="checkbox" />
              <span class="switch__track" aria-hidden="true"></span>
              <span>Sensación térmica</span>
            </label>

            <label class="switch">
              <input class="switch__input" id="setting-wallpaper" type="checkbox" />
              <span class="switch__track" aria-hidden="true"></span>
              <span>Fondo fotográfico</span>
            </label>
          </fieldset>

          <fieldset class="settings__group">
            <legend class="settings__legend">Información extra</legend>

            <label class="switch">
              <input class="switch__input" id="setting-extra-nexthours" type="checkbox" />
              <span class="switch__track" aria-hidden="true"></span>
              <span>Próximas horas</span>
            </label>

            <label class="switch">
              <input class="switch__input" id="setting-extra-sun" type="checkbox" />
              <span class="switch__track" aria-hidden="true"></span>
              <span>Amanecer / Atardecer</span>
            </label>

            <label class="switch">
              <input class="switch__input" id="setting-extra-wind" type="checkbox" />
              <span class="switch__track" aria-hidden="true"></span>
              <span>Viento</span>
            </label>

            <label class="switch">
              <input class="switch__input" id="setting-extra-humidityuv" type="checkbox" />
              <span class="switch__track" aria-hidden="true"></span>
              <span>Humedad / UV</span>
            </label>

            <label class="switch">
              <input class="switch__input" id="setting-extra-trend" type="checkbox" />
              <span class="switch__track" aria-hidden="true"></span>
              <span>Tendencia vs hace 1h</span>
            </label>
          </fieldset>

          <div class="settings__group">
            <label class="settings__label" for="setting-interval">Cambiar el fondo cada</label>
            <select class="settings__select" id="setting-interval"></select>
          </div>
        </div>
      </dialog>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
