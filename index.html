<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=6e7b5426-3ec0-4231-bc61-1692d51436eb
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0e14" />
    <link rel="stylesheet" href="src/styles/index.css" />
    <link rel="shortcut icon" href="assets/img/icon.png" type="image/x-icon" />
    <meta
      name="description"
      content="Reloj y clima de una ciudad sobre un fondo de pantalla rotativo, para dejar en el televisor o en el movil."
    />
    <meta
      name="keywords"
      content="WeatherApp,Braiidev,clima,reloj,tiempo,geolocalizacion,screensaver"
    />
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5052094798057186"
      crossorigin="anonymous"
    ></script>
    <title>WeatherApp - Braiidev</title>
  </head>

  <body>
    <div class="board">
      <div id="background" class="wallpaper" aria-hidden="true">
        <div id="tapeA" class="wallpaper__tape"></div>
        <div id="tapeB" class="wallpaper__tape"></div>
      </div>
      <div class="scrim" aria-hidden="true"></div>

      <main class="dashboard">
        <section class="card" aria-label="Clima actual">
          <p class="card__city" id="location"></p>

          <div class="card__now">
            <span class="card__temp" id="weather"></span>
            <span class="meteo-icon card__icon" id="icon" aria-hidden="true"></span>
          </div>

          <p class="card__condition" id="condition"></p>

          <ol
            class="forecast"
            id="forecast"
            aria-label="Pronóstico de los próximos días"
          ></ol>

          <button class="retry" id="retry" type="button" hidden>
            Reintentar
          </button>
        </section>

        <footer class="clock">
          <p class="clock__date" id="day"></p>
          <div class="clock__time" id="time"></div>
        </footer>
      </main>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
